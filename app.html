<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <meta name="theme-color" content="#0e7a6e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Someday">

  <title>Someday — see the day you can afford to retire</title>
  <!-- Social sharing cards -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Someday">
  <meta property="og:title" content="Someday — see the day you can afford to retire">

  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="Someday — see the day you can afford to retire">

  <link rel="manifest" href="v4/manifest.json">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%230e7a6e'/%3E%3Ctext x='50' y='70' font-size='60' text-anchor='middle' fill='white' font-family='sans-serif' font-weight='bold'%3ES%3C/text%3E%3C/svg%3E">
</head>
<body>
  <a href="#main" class="skip-link">Skip to content</a>

  <noscript>
    <div style="max-width:640px;margin:3rem auto;padding:0 1.25rem;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;color:#0f172a;line-height:1.6;">
      <h1 style="font-size:1.6rem;">Someday — see the day you can afford to retire</h1>
      <p>A private, UK-accurate retirement planner for couples. It answers one question — “can we afford to stop work, and when?” — in plain English, with your figures staying on your own device.</p>
      <p><strong>Someday needs JavaScript to run the calculations.</strong> Please enable it, then reload.</p>
      <p><a href="index.html">Why I built it</a> · <a href="guide.html">How it works</a> · <a href="legal.html">Terms &amp; privacy (not financial advice)</a></p>
    </div>
  </noscript>

  <header class="site">
    <div class="hdr-inner">
      <div class="brand"><a href="index.html" style="color:inherit;text-decoration:none;" aria-label="Someday home">Some<em>day</em></a><span class="tagline">we retire, I think</span><span class="yr">2026/27</span></div>
      <div class="hdr-actions">
        <button id="btn-money" class="ghost small" title="Toggle nominal or today's money">Today's £</button>
        <button id="btn-theme" class="ghost small" aria-label="Toggle dark mode">◐</button>
      </div>
    </div>
    <nav class="tabs" role="tablist" aria-label="Sections" id="tabs">
      <button role="tab" id="tab-btn-assumptions" data-tab="assumptions" class="on" aria-selected="true">Your details</button>
      <button role="tab" id="tab-btn-events" data-tab="events" aria-selected="false" tabindex="-1">Life events</button>
      <button role="tab" id="tab-btn-dashboard" data-tab="dashboard" aria-selected="false" tabindex="-1">Dashboard</button>
      <button role="tab" id="tab-btn-accumulation" data-tab="accumulation" aria-selected="false" tabindex="-1">Saving up</button>
      <button role="tab" id="tab-btn-spending" data-tab="spending" aria-selected="false" tabindex="-1">Spending</button>
      <button role="tab" id="tab-btn-drawdown" data-tab="drawdown" aria-selected="false" tabindex="-1">Taking income</button>
      <button role="tab" id="tab-btn-tax" data-tab="tax" aria-selected="false" tabindex="-1">Tax</button>
      <button role="tab" id="tab-btn-risk" data-tab="risk" aria-selected="false" tabindex="-1">Risk</button>
      <button role="tab" id="tab-btn-estate" data-tab="estate" aria-selected="false" tabindex="-1">Estate</button>
    </nav>
  </header>

  <div class="layout">
    <main id="main" class="wrap">
      <div class="print-header" id="print-header" aria-hidden="true"></div>
      <section id="tab-assumptions" role="tabpanel" aria-labelledby="tab-btn-assumptions" tabindex="0"></section>
      <section id="tab-events" role="tabpanel" aria-labelledby="tab-btn-events" tabindex="0" hidden></section>
      <section id="tab-dashboard" role="tabpanel" aria-labelledby="tab-btn-dashboard" tabindex="0" hidden></section>
      <section id="tab-accumulation" role="tabpanel" aria-labelledby="tab-btn-accumulation" tabindex="0" hidden></section>
      <section id="tab-spending" role="tabpanel" aria-labelledby="tab-btn-spending" tabindex="0" hidden></section>
      <section id="tab-drawdown" role="tabpanel" aria-labelledby="tab-btn-drawdown" tabindex="0" hidden></section>
      <section id="tab-tax" role="tabpanel" aria-labelledby="tab-btn-tax" tabindex="0" hidden></section>
      <section id="tab-risk" role="tabpanel" aria-labelledby="tab-btn-risk" tabindex="0" hidden></section>
      <section id="tab-estate" role="tabpanel" aria-labelledby="tab-btn-estate" tabindex="0" hidden></section>
    </main>
    <aside id="kpi-rail" class="kpi-rail" aria-label="Live plan summary"></aside>
  </div>

  <!-- Native-style bottom tab bar (phones only; ≥768px falls back to the top pills).
       Five primary destinations; "More" opens a glass sheet with the rest. -->
  <nav class="tabbar no-print" id="tabbar" aria-label="Primary">
    <button class="tabbar-btn" data-tab="dashboard" aria-label="Dashboard">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 13h6V4H4zM14 20h6v-9h-6zM14 8h6V4h-6zM4 20h6v-4H4z"/></svg>
      <span>Home</span>
    </button>
    <button class="tabbar-btn" data-tab="assumptions" aria-label="Your details">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 21v-6M5 11V3M12 21v-9M12 8V3M19 21v-4M19 13V3"/><circle cx="5" cy="13" r="2"/><circle cx="12" cy="6" r="2"/><circle cx="19" cy="15" r="2"/></svg>
      <span>Details</span>
    </button>
    <button class="tabbar-btn" data-tab="drawdown" aria-label="Taking income">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="6" width="19" height="12" rx="2.5"/><circle cx="12" cy="12" r="2.5"/></svg>
      <span>Income</span>
    </button>
    <button class="tabbar-btn" data-tab="risk" aria-label="Risk">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7 2.6v5.1c0 4.4-3 7.6-7 9.3-4-1.7-7-4.9-7-9.3V5.6z"/></svg>
      <span>Risk</span>
    </button>
    <button class="tabbar-btn" data-more aria-label="More sections">
      <svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg>
      <span>More</span>
    </button>
  </nav>

  <!-- Root for glass bottom-sheets (help hints, the More menu). -->
  <div id="sheet-root"></div>

  <footer class="honesty">
    A modelling tool, not regulated financial advice. Nominal figures with your inflation assumption unless "Today's £" is on.
    <br>
    <span style="display:inline-flex;gap:1rem;flex-wrap:wrap;justify-content:center;margin-top:.5rem;">
      <a href="index.html" style="color:inherit;text-decoration:underline;">Why I built this</a>
      <a href="guide.html" style="color:inherit;text-decoration:underline;">How to use it</a>
      <a href="legal.html" style="color:inherit;text-decoration:underline;">Terms &amp; privacy</a>
      <a id="rl-support-link" href="legal.html" hidden style="color:inherit;text-decoration:underline;">Support this project ♥</a>
    </span>
  </footer>

  <!-- Disclaimer gate + optional donation (Someday product wrapper) -->
  <script type="module" src="js/access.js"></script>
  <script type="module" src="v4/app.js"></script>
  <!-- Friendly guided welcome (first visit only; never touches the maths) -->
  <script type="module" src="js/welcome.js"></script>
  <script type="module">
    // Show the "Support this project" link only once a donation link is configured
    // in config/product.js (pay-what-you-think-it's-worth model).
    import { PRODUCT } from './config/product.js';
    const s = document.getElementById('rl-support-link');
    if (s && /^https:\/\//i.test(PRODUCT.donationLink || '')) {
      s.href = PRODUCT.donationLink; s.target = '_blank'; s.rel = 'noopener'; s.hidden = false;
    }
  </script>
</body>
</html>
