name: CI Tests

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            horizon/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run all unit tests
        run: npm run test:all

      - name: Run stress tests
        run: npm run test:stress

      # Horizon is the live product (built from horizon/ and deployed to the
      # site root). Its UAT and end-to-end sweeps are blocking gates.
      - name: Install Horizon dependencies
        run: cd horizon && npm ci

      # System libraries come from the root Playwright (it knows the runner's
      # Ubuntu release); the pinned playwright-core then fetches its own
      # matching Chromium build without touching apt.
      - name: Install Playwright browsers and system dependencies
        run: npx playwright install --with-deps chromium

      - name: Install Chromium for the Horizon sweeps
        run: cd horizon && npx --no-install playwright-core install chromium

      - name: Horizon UAT sweep (builds, then 120+ checks)
        run: cd horizon && npm run uat

      - name: Horizon end-to-end (engine ↔ UI data flow)
        run: cd horizon && node e2e.mjs

      - name: Run legacy E2E tests (classic planner)
        # Non-blocking: the Horizon sweeps above are the gates for the live app.
        # These specs cover the classic planner and are being realigned; capped
        # so a hang can never take the job down with it.
        continue-on-error: true
        timeout-minutes: 6
        run: npx playwright test --project="Desktop Chrome"

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
