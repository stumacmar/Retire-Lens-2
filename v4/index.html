<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="Someday: a UK retirement model for couples, built on the structure of a spreadsheet you can trust. Accumulation, drawdown, tax, spending, life events, risk and estate.">
  <meta name="theme-color" content="#0e7a6e">
  <title>Someday</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%230e7a6e'/%3E%3Ctext x='50' y='68' font-size='52' text-anchor='middle' fill='white' font-family='sans-serif' font-weight='bold'%3ER4%3C/text%3E%3C/svg%3E">
</head>
<body>
  <a href="#main" class="skip-link">Skip to content</a>

  <header class="site">
    <div class="hdr-inner">
      <div class="brand">Some<em>day</em><span class="yr">2026/27</span></div>
      <div class="growth-ctl">
        <div class="scenario-chips" role="group" aria-label="Growth scenario">
          <button data-scen="bear">Bear</button>
          <button data-scen="base" class="on">Base</button>
          <button data-scen="bull">Bull</button>
        </div>
        <input type="range" id="growth-slider" min="0" max="12" step="0.25" value="7" aria-label="Annual growth rate percent">
        <output id="growth-out">7%</output>
      </div>
      <div class="hdr-actions">
        <button id="btn-money" class="ghost small" title="Toggle nominal or today's money">Today's £</button>
        <button id="btn-theme" class="ghost small" aria-label="Toggle dark mode">◐</button>
      </div>
    </div>
    <nav class="tabs" role="tablist" aria-label="Sections" id="tabs">
      <button role="tab" data-tab="dashboard" class="on">📊 Dashboard</button>
      <button role="tab" data-tab="assumptions">⚙️ Assumptions</button>
      <button role="tab" data-tab="accumulation">🏦 Accumulation</button>
      <button role="tab" data-tab="spending">🛒 Spending</button>
      <button role="tab" data-tab="drawdown">💰 Drawdown</button>
      <button role="tab" data-tab="tax">🧮 Tax</button>
      <button role="tab" data-tab="events">🎉 Life events</button>
      <button role="tab" data-tab="risk">⚠️ Risk</button>
      <button role="tab" data-tab="estate">🏛️ Estate</button>
    </nav>
  </header>

  <div id="money-banner" class="money-banner" hidden>
    <span>⚠️ Nominal figures: inflation is baked in, so future pounds buy less than they look. Tap "Today's £" to compare in 2026 money.</span>
  </div>

  <div class="layout">
    <main id="main" class="wrap">
      <section id="tab-dashboard" role="tabpanel"></section>
      <section id="tab-assumptions" role="tabpanel" hidden></section>
      <section id="tab-accumulation" role="tabpanel" hidden></section>
      <section id="tab-spending" role="tabpanel" hidden></section>
      <section id="tab-drawdown" role="tabpanel" hidden></section>
      <section id="tab-tax" role="tabpanel" hidden></section>
      <section id="tab-events" role="tabpanel" hidden></section>
      <section id="tab-risk" role="tabpanel" hidden></section>
      <section id="tab-estate" role="tabpanel" hidden></section>
    </main>
    <aside id="kpi-rail" class="kpi-rail" aria-label="Live plan summary"></aside>
  </div>

  <footer class="honesty">
    A modelling tool, not regulated financial advice. Nominal figures with your inflation assumption unless "Today's £" is on.
  </footer>

  <script type="module" src="app.js"></script>
</body>
</html>
