# Deploy to GitHub Pages
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # the build is committed back to main so GitHub's own branch deploy can never publish a stale copy
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: horizon/package-lock.json

      # Build the Horizon app from source and stage it into the site root, so
      # the deployed assets always match the committed source (no hand-copied,
      # possibly-stale build artifacts). Other pages (app.html, story.html, v4/)
      # are left untouched.
      - name: Build Horizon and stage into site root
        run: |
          cd horizon && npm ci && npm run build && cd ..
          rm -f assets/index-*.js assets/index-*.css horizon-app/assets/index-*.js horizon-app/assets/index-*.css
          mkdir -p assets horizon-app/assets
          # Whole dist (index, hashed assets, PWA manifest/sw/icons) → site root + subpath
          cp -r horizon/dist/. .
          cp -r horizon/dist/. horizon-app/

      # Keep the committed copy of the build in step with the source. GitHub's
      # legacy "build from branch" Pages job publishes whatever is committed and
      # can land after this workflow's deploy; identical files make the race
      # harmless. Pushes made with GITHUB_TOKEN do not trigger workflows.
      - name: Commit the staged build back to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Everything the build writes to the site root (the dist listing), so no
          # file is ever left modified-but-unstaged to block the rebase.
          (cd horizon/dist && find . -type f | sed 's#^\./##') | sed 's#^#./#' | xargs git add -A --
          (cd horizon/dist && find . -type f | sed 's#^\./##') | sed 's#^#horizon-app/#' | xargs git add -A --
          git add -A assets horizon-app/assets
          if git diff --cached --quiet; then echo "Build unchanged"; else
            git commit -m "Build: stage Horizon into the site root [skip ci]"
            git -c rebase.autoStash=true pull --rebase origin main && git push origin HEAD:main
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
